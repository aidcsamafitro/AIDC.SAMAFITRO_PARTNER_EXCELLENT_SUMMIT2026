<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0d1117; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #161b22; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #30363d; }
        h2 { text-align: center; margin-bottom: 20px; color: #58a6ff; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 14px; }
        input:focus { border-color: #58a6ff; outline: none; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: #238636; color: #fff; margin-top: 10px; }
        .btn-primary:hover { background: #2ea043; }
        .btn-camera { background: #1f6feb; color: #fff; margin-bottom: 16px; }
        .btn-camera:hover { background: #388bfd; }
        .btn-danger { background: #da3633; color: #fff; }
        .btn-secondary { background: #30363d; color: #fff; margin-bottom: 16px; }
        
        #previewContainer { display: none; text-align: center; margin-bottom: 16px; }
        #facePreview { width: 100%; max-width: 240px; border-radius: 8px; border: 2px solid #58a6ff; }
        
        /* Modal Kamera */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { position: relative; width: 100%; max-width: 360px; background: #000; padding: 16px; border-radius: 12px; text-align: center; }
        .webcam-wrapper { position: relative; width: 100%; height: 480px; overflow: hidden; border-radius: 8px; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* Frame Overlay Live */
        .frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .live-text-nama { position: absolute; bottom: 85px; width: 100%; text-align: center; font-weight: 900; font-size: 16px; color: #FF007F; text-shadow: 1px 1px 2px #000; }
        .live-text-perusahaan { position: absolute; bottom: 65px; width: 100%; text-align: center; font-weight: 800; font-size: 12px; color: #FFE600; text-shadow: 1px 1px 2px #000; }
        
        .modal-actions { margin-top: 12px; display: flex; gap: 8px; }
    </style>
</head>
<body>

    <audio id="bgMusic" src="./music.mp3" loop></audio>

    <div class="container">
        <button id="musicBtn" class="btn btn-secondary">🎵 Play Music</button>
        <h2>REGISTRASI EVENT</h2>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Masukkan nama lengkap">
            </div>
            <div class="form-group">
                <label for="perusahaan">Nama Perusahaan</label>
                <input type="text" id="perusahaan" required placeholder="Masukkan nama perusahaan">
            </div>
            <div class="form-group">
                <label for="jabatan">Jabatan</label>
                <input type="text" id="jabatan" required placeholder="Masukkan jabatan">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="contoh@email.com">
            </div>
            <div class="form-group">
                <label for="no_hp">No. WhatsApp / HP</label>
                <input type="tel" id="no_hp" required placeholder="08123456789">
            </div>

            <button type="button" id="openCamBtn" class="btn btn-camera">📸 Ambil Foto Selfie</button>

            <div id="previewContainer">
                <p style="font-size: 12px; margin-bottom: 6px;">Hasil Foto:</p>
                <img id="facePreview" alt="Preview Foto">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary">REGISTER NOW</button>
        </form>
    </div>

    <!-- Modal Kamera -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="webcam-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <img src="./frame.png" class="frame-overlay" alt="Frame">
                <div id="liveNamaText" class="live-text-nama"></div>
                <div id="livePerusahaanText" class="live-text-perusahaan"></div>
            </div>
            <div class="modal-actions">
                <button type="button" id="captureBtn" class="btn btn-primary" style="flex: 1;">AMBIL FOTO</button>
                <button type="button" id="closeCamBtn" class="btn btn-danger">BATAL</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3ueagYKwQnLg1FDUZAQQ9jTeD2shqB_lkJmQf8kc7PtvaKf9VOi3yr1DaZst_8l7uqQ/exec";
        const FRAME_IMAGE_URL = "./frame.png";

        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const openCamBtn = document.getElementById('openCamBtn');
        const closeCamBtn = document.getElementById('closeCamBtn');
        const captureBtn = document.getElementById('captureBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const webcam = document.getElementById('webcam');
        const facePreview = document.getElementById('facePreview');
        const previewContainer = document.getElementById('previewContainer');

        const liveNamaText = document.getElementById('liveNamaText');
        const livePerusahaanText = document.getElementById('livePerusahaanText');

        let videoStream = null;
        let finalCapturedBase64 = null;

        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        function startAudio() {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerText = "🔊 Mute Music";
                    removeAudioListeners();
                }).catch(() => {});
            }
        }

        function removeAudioListeners() {
            ['click', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
                document.removeEventListener(evt, startAudio);
            });
        }

        ['click', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
            document.addEventListener(evt, startAudio, { once: true });
        });

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
                musicBtn.innerText = "🎵 Play Music";
            } else {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerText = "🔊 Mute Music";
                });
            }
        });

        openCamBtn.addEventListener('click', async () => {
            const namaVal = document.getElementById('nama').value.trim();
            const perusahaanVal = document.getElementById('perusahaan').value.trim();

            if (!namaVal || !perusahaanVal) {
                alert("Harap isi Nama Lengkap dan Nama Perusahaan terlebih dahulu sebelum mengambil foto.");
                return;
            }

            liveNamaText.innerText = namaVal.toUpperCase();
            livePerusahaanText.innerText = perusahaanVal.toUpperCase();

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcam.srcObject = videoStream;
                modalOverlay.style.display = 'flex';
            } catch (err) {
                console.error("Gagal membuka kamera:", err);
                alert("Gagal membuka kamera. Mohon izinkan akses kamera.");
            }
        });

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        closeCamBtn.addEventListener('click', () => {
            stopCamera();
            modalOverlay.style.display = 'none';
        });

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = (err) => reject(err);
                img.src = src;
            });
        }

        captureBtn.addEventListener('click', async () => {
            try {
                const namaVal = document.getElementById('nama').value.toUpperCase();
                const perusahaanVal = document.getElementById('perusahaan').value.toUpperCase();

                if (document.fonts) {
                    await document.fonts.ready;
                }

                const finalCanvas = document.createElement('canvas');
                const targetW = 540;
                const targetH = 960;
                finalCanvas.width = targetW;
                finalCanvas.height = targetH;
                const ctx = finalCanvas.getContext('2d');

                ctx.fillStyle = '#060d17';
                ctx.fillRect(0, 0, targetW, targetH);

                const vW = webcam.videoWidth;
                const vH = webcam.videoHeight;
                const targetRatio = targetW / targetH;
                const videoRatio = vW / vH;

                let renderW, renderH;
                if (videoRatio > targetRatio) {
                    renderH = targetH;
                    renderW = targetH * videoRatio;
                } else {
                    renderW = targetW;
                    renderH = targetW / videoRatio;
                }

                const zoomFactor = 0.85; 
                const finalW = renderW * zoomFactor;
                const finalH = renderH * zoomFactor;

                const dx = (targetW - finalW) / 2;
                const dy = (targetH - finalH) / 2;

                ctx.save();
                ctx.translate(targetW, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(webcam, 0, 0, vW, vH, targetW - dx - finalW, dy, finalW, finalH);
                ctx.restore();

                const frameImg = await loadImage(FRAME_IMAGE_URL);
                ctx.drawImage(frameImg, 0, 0, targetW, targetH);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Nama
                ctx.font = '900 28px "Montserrat", Arial, sans-serif';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 6;
                ctx.strokeText(namaVal, 270, 755);
                ctx.fillStyle = '#FF007F'; 
                ctx.fillText(namaVal, 270, 755);

                // Perusahaan
                ctx.font = '800 20px "Montserrat", Arial, sans-serif';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 5;
                ctx.strokeText(perusahaanVal, 270, 792);
                ctx.fillStyle = '#FFE600';
                ctx.fillText(perusahaanVal, 270, 792);

                finalCapturedBase64 = finalCanvas.toDataURL('image/jpeg', 0.65);

                facePreview.src = finalCapturedBase64;
                previewContainer.style.display = 'block';

                stopCamera();
                modalOverlay.style.display = 'none';

            } catch (err) {
                console.error("Gagal mengambil foto:", err);
                alert("Gagal memproses foto.");
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!finalCapturedBase64) {
                alert("Silakan ambil foto selfie terlebih dahulu.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Mengirim Data...";

            try {
                const payload = {
                    nama: document.getElementById('nama').value,
                    no_hp: document.getElementById('no_hp').value,
                    email: document.getElementById('email').value,
                    perusahaan: document.getElementById('perusahaan').value,
                    jabatan: document.getElementById('jabatan').value,
                    fotoBase64: finalCapturedBase64
                };

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                alert("Registrasi Berhasil! Data dan foto Anda telah tersimpan.");
                form.reset();
                previewContainer.style.display = "none";
                finalCapturedBase64 = null;

            } catch (error) {
                console.error('Error detail:', error);
                alert("Terjadi kesalahan saat pengiriman data.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "REGISTER NOW";
            }
        });
    </script>
</body>
</html>
